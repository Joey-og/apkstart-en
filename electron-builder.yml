appId: com.apkstart.win
productName: ApkStart
copyright: Copyright © 2026 ApkStart

directories:
  output: dist/release
  buildResources: build

# Include only the files needed at runtime. The whole source folder goes into the package (no asar: the window agent needs real .ps1 paths)
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Used at runtime to extract .xz images (NAPI prebuilt, no ABI issues)
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Keep only Chinese and English interface languages (Electron locales drop from 41 MB to about 3 MB)
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

# Full runtime (emulator + platform-tools + system image), generated by build/prepare-runtime.js.
# Once it is in the package, first launch no longer needs any download.
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/appicon.ico
  # Install to the current user folder. Does not write to the system drive and does not require administrator rights
  requestedExecutionLevel: asInvoker

# ---------------- Microsoft Store (MSIX) ----------------
# The appx target is not in the default build list: it is used only when building a Store package (npm run build:appx).
# Normally npm run build:exe still produces only the NSIS installer.
#
# identityName / publisher must match, character for character, Partner Center ->
#   Product management -> Product identity, namely
#   Package/Identity/Name and Package/Identity/Publisher.
# The two values below are the confirmed values copied from Partner Center on 2026-11-16.
# When changing the product identity, change them here (or set APKSTART_MSIX_IDENTITY / APKSTART_MSIX_PUBLISHER).
# Note: a package built with the placeholder Publisher (CN=RoutineMiku) will be rejected by the Store outright.
appx:
  identityName: RoutineMiku.ApkStart
  publisher: "CN=58CA1DED-8AB3-4D0D-AF50-62C9B781AA4D"
  publisherDisplayName: RoutineMiku
  displayName: ApkStart
  applicationId: ApkStart
  # The only capability a full trust desktop app requires. Do not add unvirtualizedResources /
  # broadFileSystemAccess. The Store basically does not approve them, and this app avoids AppData write redirection
  # by moving the data folder to %USERPROFILE%\ApkStart, so it does not need them.
  capabilities:
    - runFullTrust
  languages:
    - zh-CN
    - en-US
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.22621.0

nsis:
  # No longer "one click install to the default folder on drive C": use the standard wizard and let the user choose the install location
  # (installing to a non system drive reduces pressure on drive C; the runtime data folder is specified separately in Settings).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  # always: rebuild it even if a .lnk with the same name already exists on the desktop.
  # The default true creates it only when it does not exist. On some machines (security software interception, the desktop
  # redirected by OneDrive, a bad shortcut left by an old version pointing to a deleted folder) there is no icon after installation,
  # or the icon still points to the old exe. always ensures it points to the current installation folder after every install.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ApkStart-${version}-Setup.exe
  # Before uninstalling, first end runtime processes that are still running, to avoid files being locked and undeletable
  # (when shredding tools such as Huorong cannot delete them, it is mostly because qemu/adb processes are still resident).
  include: build/installer.nsh
  # The installer itself already contains the full runtime (emulator + system image .gz). On first launch after installation
  # it extracts the image to the user folder automatically, and after that nothing is downloaded online.

# Compression level: normal (zlib). The image itself is already xz/gz, and this NSIS layer only compresses the Electron dlls.
# The size difference between normal and maximum is small, but maximum (LZMA) makes building the installer more than ten minutes slower.
# Note: when CI runs npx with PowerShell, an inline -c.compression=xxx is split as an argument and treated as a config file path,
# so the compression level is set here uniformly and is not overridden inline with -c in the workflow.
compression: normal

# ---------------- Linux / FydeOS ----------------
# This section was originally written in the "build" field of package.json. The electron-builder 26 schema
# no longer accepts that linux.desktop shape, which made every build (including Windows) fail directly
# at the config validation stage. It was moved uniformly to this file and specified explicitly with
# --config electron-builder.yml, so it is no longer taken over by the old config in package.json.
linux:
  target:
    - AppImage
  category: Utility
  icon: src/ui/assets/logo-128.png
  desktop:
    entry:
      Name: ApkStart
      Comment: Manage Android apps on FydeOS / Linux
      Categories: Utility;
